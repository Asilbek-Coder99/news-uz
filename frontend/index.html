<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />

    <!-- SEO -->
    <title>NEWS.UZ — O'zbekistonning eng yaxshi yangiliklar portali</title>
    <meta name="description" content="O'zbekiston, dunyo, sport, texnologiya va iqtisodiyot bo'yicha so'nggi yangiliklar" />
    <meta name="keywords" content="yangiliklar, uzbekiston, sport, texnologiya, iqtisodiyot" />

    <!-- Open Graph -->
    <meta property="og:title" content="NEWS.UZ" />
    <meta property="og:description" content="O'zbekistonning premium yangiliklar portali" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uz_UZ" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Prevent FOUC (Flash of Unstyled Content) for dark mode -->
    <script>
      (function() {
        const saved = localStorage.getItem('news-uz-theme')
        const theme = saved ? JSON.parse(saved).state?.theme : null
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
